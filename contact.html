<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>İletişim | Mehmet Celil Kandemir</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
   <div class="brand">
  <div class="brand-logo">KX</div>
  <div class="brand-text">
   <span>Mehmet Celil Kandemir</span>
    <span>Mehmet Celil Kandemir · Full-Stack + AI Developer</span>
  </div>
</div>


      <nav class="nav-links">
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="projects.html" data-i18n="nav.projects"></a>
        <a href="about.html" data-i18n="nav.about"></a>
        <a href="contact.html" data-i18n="nav.contact"></a>

        <div class="nav-lang">
          <button type="button" data-lang-btn="tr">TR</button>
          <button type="button" data-lang-btn="en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="reveal-on-scroll">
      <header class="section-header">
        <h1 class="section-title" data-i18n="contact.title"></h1>
        <p class="section-subtitle" data-i18n="contact.subtitle"></p>
      </header>

      <div class="contact-layout">
        <!-- SOL: İLETİŞİM BİLGİLERİ -->
        <aside class="contact-info-card">
          <dl class="contact-info-list">
            <dt data-i18n="contact.locationLabel"></dt>
            <dd>Denizli, Türkiye 🇹🇷</dd>

            <dt data-i18n="contact.emailLabel"></dt>
            <dd>mckandemir20@gmail.com</dd>

            <dt data-i18n="contact.socialLabel"></dt>
            <dd>
              🔗 LinkedIn:
              <a
                href="https://www.linkedin.com/in/mehmet-celil-kandemir-82678a397/"
                target="_blank"
              >
                linkedin.com/in/mehmet-celil-kandemir-82678a397
              </a>
              <br />
              🐙 GitHub:
              <a href="https://github.com/Kandexa" target="_blank"
                >github.com/Kandexa</a
              >
            </dd>
          </dl>
        </aside>

        <!-- SAĞ: FORM (FormSubmit entegre) -->
        <section class="contact-form-card">
          <h2 data-i18n="contact.formTitle"></h2>

          <!-- FormSubmit.co entegrasyonu -->
          <form
            class="contact-form"
            action="https://formsubmit.co/mckandemir20@gmail.com"
            method="POST"
          >
            <!-- FormSubmit ayarları -->
            <input type="hidden" name="_subject" value="Yeni mesaj - Kandexa Portfolio" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_captcha" value="false" />
            <!-- İstersen canlı siteye yönlendir: -->
            <input
              type="hidden"
              name="_next"
              value="https://kandexa.github.io/contact.html?success=1"
            />

            <div class="form-group">
              <label for="name" data-i18n="contact.formNameLabel"></label>
              <input
                id="name"
                name="name"
                type="text"
                class="form-control"
                data-i18n="contact.formNamePlaceholder"
                required
              />
            </div>

            <div class="form-group">
              <label for="email" data-i18n="contact.formEmailLabel"></label>
              <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                data-i18n="contact.formEmailPlaceholder"
                required
              />
            </div>

            <div class="form-group">
              <label for="message" data-i18n="contact.formMessageLabel"></label>
              <textarea
                id="message"
                name="message"
                class="form-control"
                data-i18n="contact.formMessagePlaceholder"
                required
              ></textarea>
            </div>

            <button
              type="submit"
              class="btn btn-primary"
              data-i18n="contact.formSubmit"
            ></button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span data-i18n="footer.text"></span>
    <br />
    <a href="https://github.com/Kandexa" target="_blank">GitHub: @Kandexa</a> ·
    <a
      href="https://www.linkedin.com/in/mehmet-celil-kandemir-82678a397/"
      target="_blank"
      >LinkedIn Profilim</a
    >
  </footer>

  <script src="js/lang.js"></script>
</body>
</html>
