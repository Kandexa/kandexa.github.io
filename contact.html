<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İletişim | Mehmet Celil Kandemir</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/lang.js" defer></script>
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <!-- Sol: Profil + ünvan -->
    <div class="brand">
      <div class="brand-logo">
        <img src="images/profile-circle.png" alt="Mehmet Celil Kandemir" />
      </div>
      <div class="brand-text">
        <span>Full-Stack + AI Developer</span>
        <span>Control &amp; Automation · Web · IoT &amp; AI</span>
      </div>
    </div>

    <!-- Orta: Menü -->
    <nav class="nav-links">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="projects.html" data-i18n="nav.projects"></a>
      <a href="about.html" data-i18n="nav.about"></a>
      <a href="contact.html" data-i18n="nav.contact"></a>

      <!-- Sağ: Tema + Dil -->
      <div class="nav-lang">
        <button type="button" data-lang-btn="tr">TR</button>
        <button type="button" data-lang-btn="en">EN</button>
      </div>
    </nav>
  </div>
</header>


  <main class="page">
    <section class="reveal-on-scroll">
      <header class="section-header">
        <h1 class="section-title" data-i18n="contact.title"></h1>
        <p class="section-subtitle" data-i18n="contact.subtitle"></p>
      </header>
      <div id="contact-success" class="alert-success reveal-on-scroll">
  <span data-i18n="contact.success"></span>
</div>
      <div class="contact-layout">
        <!-- SOL: İLETİŞİM BİLGİLERİ -->
        <aside class="contact-info-card">
          <dl class="contact-info-list">
            <dt data-i18n="contact.locationLabel"></dt>
            <dd>Denizli, Türkiye 🇹🇷</dd>

            <dt data-i18n="contact.emailLabel"></dt>
            <dd>mckandemir20@gmail.com</dd>

            <dt data-i18n="contact.socialLabel"></dt>
         <dd>
  🔗 LinkedIn:
  <a
    href="https://www.linkedin.com/in/mehmet-celil-kandemir-82678a397/"
    target="_blank"
  >
    Mehmet Celil Kandemir
  </a>
  <br />
  🐙 GitHub:
  <a href="https://github.com/Kandexa" target="_blank">
   Mehmet Celil Kandemir l Kandexa
  </a>
  <br />
  📸 Instagram:
  <a href="https://www.instagram.com/celil.kandemirr/" target="_blank">
    @celil.kandemirr
  </a>
</dd>
          </dl>
        </aside>

        <!-- SAĞ: FORM -->
        <section class="contact-form-card">
          <h2 data-i18n="contact.formTitle"></h2>

          <form
            class="contact-form"
            action="https://formsubmit.co/mckandemir20@gmail.com"
            method="POST"
          >
            <input type="hidden" name="_subject" value="Yeni mesaj - Kandexa Portfolio" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_captcha" value="false" />
            <input           
            type="hidden"
  name="_next"
  value="https://celilkandemir.com/contact.html?success=1"
/>

            <div class="form-group">
              <label for="name" data-i18n="contact.formNameLabel"></label>
              <input
                id="name"
                name="name"
                type="text"
                class="form-control"
                data-i18n="contact.formNamePlaceholder"
                required
              />
            </div>

            <div class="form-group">
              <label for="email" data-i18n="contact.formEmailLabel"></label>
              <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                data-i18n="contact.formEmailPlaceholder"
                required
              />
            </div>

            <div class="form-group">
              <label for="message" data-i18n="contact.formMessageLabel"></label>
              <textarea
                id="message"
                name="message"
                class="form-control"
                data-i18n="contact.formMessagePlaceholder"
                required
              ></textarea>
            </div>

            <button
              type="submit"
              class="btn btn-primary"
              data-i18n="contact.formSubmit"
            ></button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <footer class="footer">
  <span data-i18n="footer.text"></span><br />
  <a href="https://github.com/Kandexa" target="_blank">GitHub</a> ·
  <a href="https://www.linkedin.com/in/mehmet-celil-kandemir-82678a397/" target="_blank">LinkedIn</a> ·
  <a href="https://www.instagram.com/celilkandemir/" target="_blank">Instagram</a>
</footer>
</body>
</html>
