  <main class="page">
    <section class="reveal-on-scroll">
      <header class="section-header">
        <h1 class="section-title" data-i18n="contact.title"></h1>
        <p class="section-subtitle" data-i18n="contact.subtitle"></p>
      </header>

      <div id="contact-success" class="alert-success reveal-on-scroll">
        <span data-i18n="contact.success"></span>
      </div>

      <div class="contact-layout">
        <!-- SOL -->
        <aside class="contact-info-card">
          <dl class="contact-info-list">
            <dt data-i18n="contact.locationLabel"></dt>
            <dd>Denizli, Türkiye 🇹🇷</dd>

            <dt data-i18n="contact.emailLabel"></dt>
            <dd><a href="mailto:mckandemir20@gmail.com">mckandemir20@gmail.com</a></dd>

            <dt data-i18n="contact.socialLabel"></dt>
            <dd>
              🔗 LinkedIn:
              <a href="https://www.linkedin.com/in/mehmet-celil-kandemir-82678a397/" target="_blank" rel="noopener">
                Mehmet Celil Kandemir
              </a><br />
              🐙 GitHub:
              <a href="https://github.com/Kandexa" target="_blank" rel="noopener">
                Kandexa / GitHub
              </a><br />
              📸 Instagram:
             <a href="https://www.instagram.com/celil.kandemirr?igsh=MWd3bTkzcXZ3c2FiOA%3D%3D&utm_source=qr" target="_blank" rel="noopener">
  @celil.kandemirr
</a>
            </dd>
          </dl>
        </aside>

        <!-- SAĞ -->
        <section class="contact-form-card">
          <h2 data-i18n="contact.formTitle"></h2>

          <form
            class="contact-form"
            action="https://formsubmit.co/mckandemir20@gmail.com"
            method="POST"
          >
            <input type="hidden" name="_subject" value="Yeni mesaj — celilkandemir.com" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="_next" value="https://celilkandemir.com/contact.html?success=1" />

            <div class="form-group">
              <label for="name" data-i18n="contact.formNameLabel"></label>
              <input id="name" name="name" type="text" class="form-control" data-i18n="contact.formNamePlaceholder" required />
            </div>

            <div class="form-group">
              <label for="email" data-i18n="contact.formEmailLabel"></label>
              <input id="email" name="email" type="email" class="form-control" data-i18n="contact.formEmailPlaceholder" required />
            </div>

            <div class="form-group">
              <label for="message" data-i18n="contact.formMessageLabel"></label>
              <textarea id="message" name="message" class="form-control" data-i18n="contact.formMessagePlaceholder" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" data-i18n="contact.formSubmit"></button>
          </form>
        </section>
      </div>
